services:
  neo4j:
    image: neo4j:5.26-community
    container_name: graphrag-neo4j
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: "neo4j/${NEO4J_PASSWORD:-change_me_please}"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-change_me_please} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s

  app:
    build: .
    container_name: graphrag-app
    depends_on:
      neo4j:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      NEO4J_URI: "bolt://neo4j:7687"
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-change_me_please}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-}"
      LLM_MODEL_ID: "${LLM_MODEL_ID:-gpt-4o-mini}"
      EMBEDDING_BACKEND: "${EMBEDDING_BACKEND:-local}"
      EMBEDDING_MODEL_ID: "${EMBEDDING_MODEL_ID:-text-embedding-3-small}"
      TOP_K: "${TOP_K:-3}"
      DATASET_PATH: "${DATASET_PATH:-data/dataset.json}"
      AUTO_INGEST: "${AUTO_INGEST:-true}"
      API_BASE_URL: "http://localhost:8000"
    volumes:
      - .:/app          # so dataset.json / evaluation_results.json land on the host
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  neo4j_data:
